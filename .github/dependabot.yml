# Dependabot version updates: npm only (the root lockfile covers every workspace).
# Public registry only. Security updates need no config.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    ignore:
      # This repo runs Node 22 (CI, publish). @types/node tracks the RUNTIME
      # major, not the newest published types. Capped, not frozen.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # TypeScript majors are toolchain decisions taken deliberately, in step
      # with Axonometra, never per-repo by a bot.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
